name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "TestOnly!Pokemon2026"
          MSSQL_MEMORY_LIMIT_MB: "2048"
        ports:
          - 1433/tcp
        options: >-
          --hostname poke-import-it
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TestOnly!Pokemon2026' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select the installed SDK
        run: dotnet new globaljson --sdk-version "${{ steps.dotnet.outputs.dotnet-version }}"

      - name: Restore
        run: dotnet restore WepApiScrapingData.sln

      - name: Build
        run: dotnet build WepApiScrapingData.sln -c Release --no-restore

      - name: Test with isolated SQL Server
        env:
          POKEMON_IMPORT_TEST_SQL_PORT: ${{ job.services.sqlserver.ports['1433'] }}
        run: |
          if [ -z "$POKEMON_IMPORT_TEST_SQL_PORT" ]; then
            echo "::error::The isolated SQL Server port is not available."
            exit 1
          fi
          dotnet test WepApiScrapingData.sln -c Release --no-build --no-restore --verbosity normal
